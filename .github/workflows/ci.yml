name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run check
      - name: Build independent native libFLAC oracle
        run: |
          codec_native_flac=$(scripts/build-native-flac.sh)
          echo "CODEC_NATIVE_FLAC=$codec_native_flac" >> "$GITHUB_ENV"
      - run: bun run test:integration
      - run: bun run pack:check
      - run: git diff --check

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install pinned Emscripten
        run: |
          git clone --depth 1 --branch 6.0.9 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/codec-emsdk"
          test "$(git -C "$RUNNER_TEMP/codec-emsdk" rev-parse HEAD)" = 5eb0bde7585670252e8ba05e9d361627bffd08b5
          "$RUNNER_TEMP/codec-emsdk/emsdk" install 6.0.9
          "$RUNNER_TEMP/codec-emsdk/emsdk" activate 6.0.9
          echo "CODEC_EMSCRIPTEN_ROOT=$RUNNER_TEMP/codec-emsdk/upstream/emscripten" >> "$GITHUB_ENV"
      - run: bun run scripts/build-wasm.ts --verify
      - run: bun run scripts/build-decoder-wasm.ts --verify
      - run: git diff --exit-code
